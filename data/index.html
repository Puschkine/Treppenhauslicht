<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Treppenhauslicht</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1d2a35;
        --accent: #0f766e;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 760px;
        margin: 48px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.6rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      code {
        background: #ecf0f3;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Treppenhauslicht</h1>
        <p>Diese Seite wird aus <code>LittleFS</code> ausgeliefert.</p>
        <p>OTA-Update: <a href="/update">/update</a></p>
        <p>Status API: <a href="/status">/status</a></p>
      </div>
    </div>
  </body>
</html>
