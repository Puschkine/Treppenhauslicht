<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#7b341e">
    <title>Treppenhauslicht Startseite</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      :root {
        color-scheme: light;
        --bg: #f3efe7;
        --card: #ffffff;
        --text: #1f1a14;
        --accent: #7b341e;
        --accent-2: #c05621;
        --muted: #6b5f52;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at 10% 10%, #fff6e8 0%, var(--bg) 45%, #e6dccf 100%);
        color: var(--text);
        -webkit-text-size-adjust: 100%;
      }
      .wrap {
        max-width: 980px;
        margin: 18px auto;
        padding: 0 12px 18px;
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 10px 26px rgba(71, 46, 30, 0.11);
        border: 1px solid #eadfce;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 1.05rem;
      }
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
      }
      .status {
        margin-top: 8px;
        font-family: Consolas, "Courier New", monospace;
        white-space: pre-wrap;
        background: #f8f5ef;
        border-radius: 10px;
        padding: 10px;
        font-size: 0.84rem;
        max-height: 210px;
        overflow: auto;
      }
      .debuglog {
        font-family: Consolas, "Courier New", monospace;
        white-space: pre-wrap;
        background: #fffaf3;
        border: 1px solid #ecdcc5;
        border-radius: 10px;
        padding: 10px;
        font-size: 0.83rem;
        min-height: 200px;
        max-height: 340px;
        overflow: auto;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      button,
      .linkbtn {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        min-height: 40px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
      }
      .primary {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: #fff;
      }
      .ghost {
        background: #f8eee3;
        color: #52290f;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 10px 0 4px;
      }
      .ok {
        color: #0f7a35;
      }
      .err {
        color: #aa1f2d;
      }
      @media (max-width: 680px) {
        .wrap {
          margin: 10px auto;
          padding: 0 10px 12px;
        }
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Treppenhauslicht Startseite</h1>
        <p class="hint" id="ipSummary">STA: - | AP: -</p>
        <p class="hint" id="espClock">ESP Uhrzeit: -</p>
        <div class="toggle">
          <strong>Automatikbetrieb</strong>
          <button id="automationBtn" class="ghost" type="button">-</button>
        </div>
        <p id="actionResult" class="hint">Bereit.</p>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Lichtsteuerung</h2>
          <div class="actions" style="margin-bottom:8px">
            <button class="primary" type="button" id="allOnBtn">Alle EIN</button>
            <button class="ghost" type="button" id="allOffBtn">Alle AUS</button>
          </div>
          <div class="actions">
            <button class="ghost" type="button" data-node="102" data-ch="0" data-on="1">Treppe EIN</button>
            <button class="ghost" type="button" data-node="102" data-ch="0" data-on="0">Treppe AUS</button>
            <button class="ghost" type="button" data-node="103" data-ch="0" data-on="1">Gang Hinten 0 EIN</button>
            <button class="ghost" type="button" data-node="103" data-ch="0" data-on="0">Gang Hinten 0 AUS</button>
            <button class="ghost" type="button" data-node="103" data-ch="1" data-on="1">Gang Hinten 1 EIN</button>
            <button class="ghost" type="button" data-node="103" data-ch="1" data-on="0">Gang Hinten 1 AUS</button>
            <button class="ghost" type="button" data-node="104" data-ch="0" data-on="1">Gang Vorne 0 EIN</button>
            <button class="ghost" type="button" data-node="104" data-ch="0" data-on="0">Gang Vorne 0 AUS</button>
            <button class="ghost" type="button" data-node="104" data-ch="1" data-on="1">Gang Vorne 1 EIN</button>
            <button class="ghost" type="button" data-node="104" data-ch="1" data-on="0">Gang Vorne 1 AUS</button>
          </div>
        </div>

        <div class="card">
          <h2>Status</h2>
          <div class="status" id="statusBox">Lade...</div>
          <div class="actions" style="margin-top:8px">
            <a class="linkbtn ghost" href="/settings.html">Einstellungen</a>
            <a class="linkbtn ghost" href="/update">OTA Update</a>
          </div>
        </div>

        <div class="card">
          <h2>Debug Log</h2>
          <div class="debuglog" id="logBox">Lade Debug-Ausgaben...</div>
          <div class="actions" style="margin-top:8px">
            <button class="ghost" id="refreshLogBtn" type="button">Log aktualisieren</button>
            <button class="ghost" id="clearLogBtn" type="button">Log leeren</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const q = (id) => document.getElementById(id);

      function relayName(node, channel) {
        if (node === 102 && channel === 0) return "Treppe";
        if (node === 103 && channel === 0) return "Gang Hinten 0";
        if (node === 103 && channel === 1) return "Gang Hinten 1";
        if (node === 104 && channel === 0) return "Gang Vorne 0";
        if (node === 104 && channel === 1) return "Gang Vorne 1";
        return `Shelly ${node} Kanal ${channel}`;
      }

      function setActionResult(text, ok = true) {
        const el = q("actionResult");
        el.textContent = text;
        el.className = ok ? "hint ok" : "hint err";
      }

      async function postJson(url, payload) {
        const r = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!r.ok) {
          throw new Error(`HTTP ${r.status}`);
        }
      }

      async function loadStatus() {
        const r = await fetch("/api/state");
        const s = await r.json();
        const staIp = s.ipSta || s.ip || "-";
        const apIp = s.ipAp || "-";
        q("ipSummary").textContent = `STA: ${staIp} | AP: ${apIp}`;
        q("espClock").textContent = `ESP Uhrzeit: ${s.espTimeLocal || "unbekannt"}`;

        const autoBtn = q("automationBtn");
        const autoOn = Boolean(s.automationEnabled);
        autoBtn.textContent = autoOn ? "Automatik EIN" : "Automatik AUS";
        autoBtn.dataset.enabled = autoOn ? "1" : "0";
        autoBtn.className = autoOn ? "primary" : "ghost";

        q("statusBox").textContent = JSON.stringify(s, null, 2);
      }

      async function loadLogs() {
        const r = await fetch("/api/logs");
        const text = await r.text();
        q("logBox").textContent = text || "(keine Eintraege)";
      }

      async function clearLogs() {
        await fetch("/api/logs/clear", { method: "POST" });
        await loadLogs();
      }

      async function setAll(on) {
        await postJson("/api/manual/relay", { all: true, on });
        setActionResult(on ? "Alle Kanaele eingeschaltet." : "Alle Kanaele ausgeschaltet.");
        await loadStatus();
      }

      async function setSingle(node, channel, on) {
        await postJson("/api/manual/relay", { node, channel, on });
        setActionResult(`${relayName(node, channel)} -> ${on ? "EIN" : "AUS"}`);
        await loadStatus();
      }

      async function toggleAutomation() {
        const currentlyOn = q("automationBtn").dataset.enabled === "1";
        const newState = !currentlyOn;
        await postJson("/api/automation", { enabled: newState });
        setActionResult(newState ? "Automatik eingeschaltet." : "Automatik ausgeschaltet.");
        await loadStatus();
      }

      q("allOnBtn").addEventListener("click", () => setAll(true).catch((e) => setActionResult(`Fehler: ${e.message}`, false)));
      q("allOffBtn").addEventListener("click", () => setAll(false).catch((e) => setActionResult(`Fehler: ${e.message}`, false)));
      q("automationBtn").addEventListener("click", () => toggleAutomation().catch((e) => setActionResult(`Fehler: ${e.message}`, false)));
      q("refreshLogBtn").addEventListener("click", () => loadLogs().catch((e) => setActionResult(`Fehler: ${e.message}`, false)));
      q("clearLogBtn").addEventListener("click", () => clearLogs().catch((e) => setActionResult(`Fehler: ${e.message}`, false)));

      document.querySelectorAll("button[data-node]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const node = Number(btn.dataset.node);
          const channel = Number(btn.dataset.ch);
          const on = btn.dataset.on === "1";
          setSingle(node, channel, on).catch((e) => setActionResult(`Fehler: ${e.message}`, false));
        });
      });

      loadStatus().then(loadLogs).catch((e) => setActionResult(`Fehler beim Laden: ${e.message}`, false));
      setInterval(() => loadStatus().catch(() => {}), 3000);
      setInterval(() => loadLogs().catch(() => {}), 2000);
    </script>
  </body>
</html>
