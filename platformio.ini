; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
	https://github.com/Puschkine/WLANsupport.git
	https://github.com/Puschkine/Debug.git
	ESP32Async/AsyncTCP@^3.4.1
	ESP32Async/ESPAsyncWebServer@^3.8.1
	ayushsharma82/ElegantOTA@^4.0.0
	bblanchon/ArduinoJson@^7.1.0
lib_compat_mode = strict
build_flags =
   	-D WLAN_MAX_RETRY_COUNTER=5
	-D WLAN_MAX_REBOOT_COUNT=3
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D WIFI_SSID='"MeinWlan"'
	-D WIFI_PW='"moritz0806"'
	-D AP_WIFI_SSID='"Treppenhauslicht"'
	-D AP_WIFI_PW='"12345678"'
	-D __USE_AP__
